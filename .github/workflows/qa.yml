name: Despliegue QA (Develop)

on:
  push:
    branches: [ "Develop" ] # Asegúrate que sea minuscula (develop)
    paths:
      - 'front/**'
      - 'back/**'
  workflow_dispatch:

env:
  # --- DATOS DEL PROYECTO ---
  PROJECT_ID: 'restomap-478918'
  REGION: 'us-central1'
  REPO_NAME: 'repo'
  
  # Nombres de los servicios
  SERVICE_BACK: 'back-qa'
  SERVICE_FRONT: 'front-qa'
  
  # Instancia SQL
  SQL_INSTANCE: 'restomap-478918:us-central1:restomap'

jobs:
  # ------------------------------------------------------------------
  # TRABAJO 1: BACKEND (Python + SQL + Secretos)
  # ------------------------------------------------------------------
  deploy-back-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend: 'back/**'

      # Autenticación (Revisa si usas github-provider-2 o el que funcionó)
      - if: steps.filter.outputs.backend == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/414435283954/locations/global/workloadIdentityPools/github-pool/providers/github-provider1'
          service_account: 'github-deploy-sa@restomap-478918.iam.gserviceaccount.com'

      - if: steps.filter.outputs.backend == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.filter.outputs.backend == 'true'
        name: Build & Deploy Back QA
        working-directory: ./back
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/back:${{ github.sha }}"
          
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          
          # AQUÍ ESTÁ LA MAGIA DE LOS SECRETOS
          gcloud run deploy ${{ env.SERVICE_BACK }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --add-cloudsql-instances="${{ env.SQL_INSTANCE }}" \
            --set-env-vars="DB_HOST=/cloudsql/${{ env.SQL_INSTANCE }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }}"

  # ------------------------------------------------------------------
  # TRABAJO 2: FRONTEND (Next.js en Cloud Run)
  # ------------------------------------------------------------------
  deploy-front-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend: 'front/**'

      - if: steps.filter.outputs.frontend == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/414435283954/locations/global/workloadIdentityPools/github-pool/providers/github-provider1'
          service_account: 'github-deploy-sa@restomap-478918.iam.gserviceaccount.com'

      - if: steps.filter.outputs.frontend == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.filter.outputs.frontend == 'true'
        name: Build & Deploy Front QA
        working-directory: ./front
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/front:${{ github.sha }}"
          
          # IMPORTANTE: Cambia esta URL cuando tengas la definitiva del backend
          BACKEND_URL="https://back-qa-pendiente.run.app"

          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL \
            -t $IMAGE_TAG .
            
          docker push $IMAGE_TAG
          
          gcloud run deploy ${{ env.SERVICE_FRONT }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0
