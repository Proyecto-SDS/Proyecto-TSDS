name: Despliegue QA (Release)

on:
  push:
    branches: [ "release" ] # CORREGIDO: "realease" suele ser un error de dedo
    paths:
      - 'front/**'
      - 'back/**'
  workflow_dispatch: # Botón para activar manual si es necesario

env:
  # --- TUS DATOS REALES ---
  PROJECT_ID: 'restomap-478918'
  REGION: 'us-central1'
  REPO_NAME: 'repo' # El nombre del repositorio en Artifact Registry
  
  # Nombres de los servicios en Cloud Run
  SERVICE_BACK: 'back-qa'
  SERVICE_FRONT: 'front-qa' # Antes era un Bucket, ahora es un Servicio
  
  # Tu Base de Datos
  SQL_INSTANCE: 'restomap-478918:us-central1:restomap'

jobs:
  # ------------------------------------------------------------------
  # TRABAJO 1: BACKEND (Python + SQL)
  # ------------------------------------------------------------------
  deploy-back-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend: 'back/**'

      # Autenticación con el Provider que ya funciona
      - if: steps.filter.outputs.backend == 'true'
        uses: google-github-actions/auth@v2
        with:
          # REVISA QUE EL FINAL SEA EL PROVIDER CORRECTO (ej: github-provider-2 o 3)
          workload_identity_provider: 'projects/414435283954/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2'
          service_account: 'github-deploy-sa@restomap-478918.iam.gserviceaccount.com'

      - if: steps.filter.outputs.backend == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.filter.outputs.backend == 'true'
        name: Build & Deploy Back QA
        working-directory: ./back
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
          # Creamos etiqueta con SHA para trazabilidad
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/back:${{ github.sha }}"
          
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          
          # Despliegue con conexión a SQL
          gcloud run deploy ${{ env.SERVICE_BACK }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --add-cloudsql-instances="${{ env.SQL_INSTANCE }}" \
            --set-env-vars="DB_HOST=/cloudsql/${{ env.SQL_INSTANCE }}"

  # ------------------------------------------------------------------
  # TRABAJO 2: FRONTEND (Next.js en Cloud Run)
  # ------------------------------------------------------------------
  deploy-front-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend: 'front/**'

      - if: steps.filter.outputs.frontend == 'true'
        uses: google-github-actions/auth@v2
        with:
          # Debe ser el mismo provider que arriba
          workload_identity_provider: 'projects/414435283954/locations/global/workloadIdentityPools/github-pool/providers/github-provider-2'
          service_account: 'github-deploy-sa@restomap-478918.iam.gserviceaccount.com'

      - if: steps.filter.outputs.frontend == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.filter.outputs.frontend == 'true'
        name: Build & Deploy Front QA
        working-directory: ./front
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/front:${{ github.sha }}"
          
          # IMPORTANTE: Pasamos la URL del back al momento de construir (Build Args)
          # Cambia esta URL cuando tengas la definitiva del backend de QA
          BACKEND_URL="https://back-qa-pendiente.run.app"

          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL \
            -t $IMAGE_TAG .
            
          docker push $IMAGE_TAG
          
          # Despliegue en Cloud Run (Ya no usamos Buckets)
          gcloud run deploy ${{ env.SERVICE_FRONT }} \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0
