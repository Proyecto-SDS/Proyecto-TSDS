name: Despliegue QA (Develop)

on:
  push:
    branches: [ "develop" ]
    paths:
      # ACTUALIZADO: Escucha cambios dentro de app/cápsulas
      - 'app/cápsulas/**'
  workflow_dispatch: # Botón manual

env:
  PROJECT_ID: 'restomap-478918'
  REGION: 'us-central1'
  REPO_NAME: 'repo'
  SQL_INSTANCE: 'restomap-478918:us-central1:restomap'

# --- SECCIÓN OBLIGATORIA PARA AUTH ---
permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  # ==================================================================
  # TRABAJO 1: BACKEND (Matriz)
  # ==================================================================
  deploy-back:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capsule: [cápsula1, cápsula2, cápsula3]

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            # ACTUALIZADO: Ruta con app/
            backend: 'app/cápsulas/${{ matrix.capsule }}/back/**'

      # Autenticación (Se ejecuta si hay cambios O si es manual)
      - if: steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/414435283954/locations/global/workloadIdentityPools/github-pool/providers/github-provider1'
          service_account: 'github-deploy-sa@restomap-478918.iam.gserviceaccount.com'

      - if: steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
        name: Deploy Back (${{ matrix.capsule }})
        # ACTUALIZADO: Directorio de trabajo con app/
        working-directory: ./app/cápsulas/${{ matrix.capsule }}/back
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
          SERVICE_NAME="back-qa-${{ matrix.capsule }}"
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/back-${{ matrix.capsule }}:${{ github.sha }}"
          
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --add-cloudsql-instances="${{ env.SQL_INSTANCE }}" \
            --set-env-vars="DB_HOST=/cloudsql/${{ env.SQL_INSTANCE }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }}"

  # ==================================================================
  # TRABAJO 2: FRONTEND (Matriz)
  # ==================================================================
  deploy-front:
    needs: deploy-back
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        capsule: [cápsula1, cápsula2, cápsula3]

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            # ACTUALIZADO: Ruta con app/
            frontend: 'app/cápsulas/${{ matrix.capsule }}/front/**'

      # Autenticación
      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/414435283954/locations/global/workloadIdentityPools/github-pool/providers/github-provider1'
          service_account: 'github-deploy-sa@restomap-478918.iam.gserviceaccount.com'

      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@v2

      - if: steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        name: Deploy Front (${{ matrix.capsule }})
        # ACTUALIZADO: Directorio de trabajo con app/
        working-directory: ./app/cápsulas/${{ matrix.capsule }}/front
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev
          
          SERVICE_NAME="front-qa-${{ matrix.capsule }}"
          # Nota: Asegúrate de que esta URL sea correcta. Si el back falla en desplegarse, esta URL podría no existir aún.
          BACKEND_URL="https://back-qa-${{ matrix.capsule }}-pendiente.run.app"
          
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/front-${{ matrix.capsule }}:${{ github.sha }}"
          
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=$BACKEND_URL \
            -t $IMAGE_TAG .
            
          docker push $IMAGE_TAG
          
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_TAG \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --min-instances 0
